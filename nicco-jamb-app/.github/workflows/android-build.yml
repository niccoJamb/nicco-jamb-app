name: Android Build (APK + AAB)

# Builds signed release APK and AAB for the Nicco JAMB Practice App.
# Trigger manually from the Actions tab, or on a version tag push (v*).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    - base64-encoded contents of nicco-release.keystore
#   KEYSTORE_PASSWORD  - keystore password
#   KEY_ALIAS          - e.g. nicco
#   KEY_PASSWORD       - key password
#
# Outputs (download from the run's Artifacts section):
#   nicco-jamb-apk  -> app-release.apk   (direct install on Android phones)
#   nicco-jamb-aab  -> app-release.aab   (Google Play Store submission)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build signed APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Install Capacitor packages
        run: |
          npm install --save \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            @capacitor/splash-screen

      - name: Build web bundle (Vite)
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure version & min SDK in build.gradle
        run: |
          cd android/app
          # Ensure minSdkVersion 23, targetSdk 34, versionCode 1, versionName 1.0.0
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 23/' build.gradle || true
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/' build.gradle || true
          sed -i 's/versionCode [0-9]*/versionCode 1/' build.gradle || true
          sed -i 's/versionName "[^"]*"/versionName "1.0.0"/' build.gradle || true

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. See ANDROID_BUILD.md (Option B)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/nicco-release.keystore

      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storeFile=nicco-release.keystore
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Inject release signingConfig into app/build.gradle
        run: |
          cd android/app
          if ! grep -q "signingConfigs.release" build.gradle; then
            python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("build.gradle")
          src = p.read_text()
          inject = '''
              signingConfigs {
                  release {
                      def keystorePropertiesFile = rootProject.file("key.properties")
                      def keystoreProperties = new Properties()
                      keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
                      storeFile file("nicco-release.keystore")
                      storePassword keystoreProperties['storePassword']
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                  }
              }
          '''
          # add signingConfigs block right after "android {"
          src = re.sub(r"(android\s*\{)", r"\1" + inject, src, count=1)
          # ensure release buildType uses it
          if "signingConfig signingConfigs.release" not in src:
              src = re.sub(
                  r"(buildTypes\s*\{\s*release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release",
                  src, count=1
              )
          p.write_text(src)
          PY
          fi

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Build release AAB
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nicco-jamb-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: nicco-jamb-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
