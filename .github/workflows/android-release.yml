name: Android Release Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          cd nicco-jamb-app
          npm install

      - name: Build web assets
        run: |
          cd nicco-jamb-app
          npm run build

      - name: Sync Capacitor
        run: |
          cd nicco-jamb-app
          npx cap sync android

      - name: Decode keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > nicco-jamb-app/nicco-release.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Make gradlew executable
        run: chmod +x nicco-jamb-app/android/gradlew

      - name: Build Release AAB
        working-directory: nicco-jamb-app/android
        run: ./gradlew bundleRelease

      - name: Sign AAB
        working-directory: nicco-jamb-app/android
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore ../../nicco-jamb-app/nicco-release.keystore \
            app/build/outputs/bundle/release/app-release.aab \
            $KEY_ALIAS \
            -storepass $KEYSTORE_PASSWORD \
            -keypass $KEY_PASSWORD
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: signed-aab
          path: nicco-jamb-app/android/app/build/outputs/bundle/release/app-release.aab